# Runs posts on the homelab next to Caddy and Authelia. Run as root:
#   docker compose up -d
# config/ must hold config.yaml (see config.example.yaml); posts.db is
# created next to it. Both directories must be writable by uid 65532
# (distroless nonroot): chown -R 65532:65532 config data
services:
  posts:
    image: ghcr.io/ericwvi/posts:latest
    container_name: posts
    restart: unless-stopped
    environment:
      - POSTS_OIDC_CLIENT_SECRET=${POSTS_OIDC_CLIENT_SECRET}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    networks:
      - my-network

# Shared homelab network. The workflow service listens on its gateway
# address on the host (172.28.1.1), which config.yaml's workflow.url points at.
networks:
  my-network:
    external: true
