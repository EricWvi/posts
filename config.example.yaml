# HTTP listen address
listen: ":36751"
# SQLite database. A relative path is resolved against the directory of
# this file, so in the container it lands in the mounted config directory.
database: "posts.db"
# Converted posts: <data_dir>/<year>/<month>/<post-id>/<slug>.md plus assets/
# In the container use "/app/data".
data_dir: "./data"
# Largest html file one upload may carry, in MB.
max_upload_mb: 100

# Origin browsers use to reach this site. The OIDC redirect URI is
# <public_url>/auth/callback and must be registered with the provider.
public_url: "https://posts.example.com"

# Authelia (or any OIDC provider) confidential client.
oidc:
  issuer: "https://auth.example.com"
  client_id: "posts"
  # Prefer the POSTS_OIDC_CLIENT_SECRET environment variable.
  client_secret: ""

# The wf-posts bridge on the Docker host. It listens on the host's gateway
# address of the Docker network, so only the host and its containers reach it.
wf_posts:
  url: "http://172.28.1.1:55680"
  # One conversion, including the model run. Units: h, m, s.
  timeout: "30m"

# Local development only: skip OIDC and sign every request in as this user.
# dev_user: "eric"
